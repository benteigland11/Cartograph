[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cartograph-mcp"
version = "0.1.0"
description = "Widget library manager for AI agents — MCP server + CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
http = [
    "uvicorn",
    "starlette",
]

[project.scripts]
cartograph = "cartograph.server:main"

[tool.hatch.build.targets.wheel]
packages = ["cartograph"]

[tool.hatch.build.targets.wheel.force-include]
"cartograph/seed_library" = "cartograph/seed_library"

[tool.pytest.ini_options]
testpaths = ["tests"]
