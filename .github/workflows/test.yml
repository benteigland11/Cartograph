name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install iverilog (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Install iverilog (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install icarus-verilog

      - name: Install iverilog (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install iverilog -y || (sleep 15 && choco install iverilog -y)

      - name: Install Angular CLI
        run: npm install -g @angular/cli

      - name: Install PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pcov
          tools: composer

      - name: Install dependencies
        run: pip install -e . && pip install pytest pytest-cov

      - name: OpenAPI spec freshness
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          python scripts/gen_openapi.py
          if ! git diff --quiet docs/cloud_api.json; then
            echo "::error::docs/cloud_api.json is stale — run 'python scripts/gen_openapi.py' and commit the result"
            git diff docs/cloud_api.json
            exit 1
          fi

      - name: Run tests
        run: pytest --tb=short -q
