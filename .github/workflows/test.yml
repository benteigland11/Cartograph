name: Tests

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  # No paths-ignore on PRs: branch protection requires every test cell, and a
  # workflow skipped by path never reports them, deadlocking docs-only PRs.
  # Docs-only PRs still run the jobs but skip install + tests (see "scope").
  pull_request:
    branches: [master]
  workflow_call:
    inputs:
      full_install:
        description: "Skip path filtering and install every engine tool (used by release pipeline)."
        required: false
        type: boolean
        default: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    # Install every engine when this is a release-gating run: any push to
    # master (the auto-tag/publish chain reads this same run) or an explicit
    # full_install caller. PRs stay path-filtered for fast feedback.
    env:
      FULL_INSTALL: ${{ inputs.full_install || github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@v6

      # Detect which engines are affected by this change so we can skip
      # unneeded tool installs on unrelated commits. Any edit to a cross-
      # cutting file (base.py, registry.py, validator.py, contamination.py,
      # pyproject.toml, or the workflow itself) triggers every install.
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            core:
              - 'src/cartograph/languages/base.py'
              - 'src/cartograph/languages/registry.py'
              - 'src/cartograph/validator.py'
              - 'src/cartograph/contamination.py'
              - 'pyproject.toml'
              - '.github/workflows/**'
            systemverilog:
              - 'src/cartograph/languages/systemverilog.py'
            angular:
              - 'src/cartograph/languages/angular.py'
            php:
              - 'src/cartograph/languages/php.py'
            terraform:
              - 'src/cartograph/languages/terraform.py'
            go:
              - 'src/cartograph/languages/go.py'
              - 'src/cartograph/languages/scanners/go_scanner.go'
            spice:
              - 'src/cartograph/languages/spice.py'
            rust:
              - 'src/cartograph/languages/rust.py'
              - 'src/cartograph/languages/scanners/rust_scanner.rs'
            gdscript:
              - 'src/cartograph/languages/gdscript.py'
              - 'src/cartograph/languages/scanners/gdscript_scanner.gd'
            java:
              - 'src/cartograph/languages/java.py'
              - 'src/cartograph/languages/scanners/java_scanner.java'
            lean:
              - 'src/cartograph/languages/lean.py'
              - 'src/cartograph/languages/scanners/lean_scanner.lean'
            csharp:
              - 'src/cartograph/languages/csharp.py'
              - 'src/cartograph/languages/scanners/csharp_scanner.cs'
            flutter:
              - 'src/cartograph/languages/flutter.py'
              - 'src/cartograph/languages/scanners/flutter_scanner.dart'
            blender:
              - 'src/cartograph/languages/blender.py'
              - 'src/cartograph/languages/scanners/blender_runner.py'
            kicad:
              - 'src/cartograph/languages/kicad.py'

      # Separate filter: "every" quantifier lets the negations exclude docs,
      # which would break the any-match engine filters above.
      - uses: dorny/paths-filter@v4
        id: scope
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**.md'
              - '!LICENSE'
              - '!.gitignore'

      - name: Docs-only change, skipping tests
        if: env.FULL_INSTALL != 'true' && steps.scope.outputs.code != 'true'
        run: echo "Only docs changed; required checks report success without running the suite."

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install iverilog (Linux)
        if: matrix.os == 'ubuntu-latest' && (env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.systemverilog == 'true')
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Install iverilog (macOS)
        if: matrix.os == 'macos-latest' && (env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.systemverilog == 'true')
        run: brew install icarus-verilog

      - name: Install iverilog (Windows)
        if: matrix.os == 'windows-latest' && (env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.systemverilog == 'true')
        run: choco install iverilog -y || (sleep 15 && choco install iverilog -y)

      - name: Install Angular CLI
        if: env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.angular == 'true'
        run: npm install -g @angular/cli

      - name: Install PHP and Composer
        if: env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.php == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pcov
          tools: composer

      - name: Install Terraform
        if: env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.9.0'
          terraform_wrapper: false

      # setup-go works identically on all three platforms - no per-OS steps.
      - name: Install Go
        if: env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.go == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Install ngspice (Linux)
        if: matrix.os == 'ubuntu-latest' && (env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.spice == 'true')
        run: sudo apt-get update && sudo apt-get install -y ngspice

      - name: Install ngspice (macOS)
        if: matrix.os == 'macos-latest' && (env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.spice == 'true')
        run: brew install ngspice

      - name: Install ngspice (Windows)
        if: matrix.os == 'windows-latest' && (env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.spice == 'true')
        run: choco install ngspice -y || (sleep 15 && choco install ngspice -y)

      # Rust ships preinstalled on GH runners; the engine only needs the
      # coverage subcommand + the llvm-tools-preview component for the gate.
      # taiki-e/install-action pulls a prebuilt cargo-llvm-cov on all 3 OSes.
      - name: Install cargo-llvm-cov
        if: env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.rust == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Add llvm-tools-preview component
        if: env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.rust == 'true'
        run: rustup component add llvm-tools-preview

      # GDScript validates via the single headless `godot` binary. setup-godot
      # installs the standard (non-.NET) build and puts `godot` on PATH on all
      # three platforms in one step. 4.5.0 matches the scaffold's declared
      # config/features feature level.
      - name: Install Godot
        if: env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.gdscript == 'true'
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.0
          use-dotnet: false

      # setup-java + setup-gradle both work identically on all three
      # platforms. JaCoCo is a Gradle core plugin and JUnit 5 is fetched
      # from Maven Central by the scaffolded build, so JDK + Gradle is the
      # whole toolchain.
      - name: Install JDK
        if: env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.java == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        if: env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.java == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      # setup-dotnet works identically on all three platforms. xUnit and
      # coverlet are fetched from NuGet by the scaffolded test project, so
      # the SDK is the whole toolchain. SDK 10+ is required: file-based
      # `dotnet run` executes the native scanner.
      - name: Install .NET SDK
        if: env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.csharp == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # subosito/flutter-action works identically on all three platforms and
      # caches the SDK. The Flutter SDK bundles its own Dart SDK (used to run
      # the native scanner), and flutter_test ships with the SDK, so this one
      # step is the whole toolchain. Pinned to the stress-tested release.
      - name: Install Flutter
        if: env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.flutter == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      # Lean's whole toolchain (elan + lean + lake) comes from the single
      # official elan installer; `stable` resolves the current Lean 4
      # release. The retry guards flaky release-server downloads.
      - name: Install Lean (Linux/macOS)
        if: matrix.os != 'windows-latest' && (env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.lean == 'true')
        shell: bash
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain stable || (sleep 15 && sh elan-init.sh -y --default-toolchain stable)
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Lean (Windows)
        if: matrix.os == 'windows-latest' && (env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.lean == 'true')
        shell: pwsh
        run: |
          curl -sSf -o elan-init.ps1 https://elan.lean-lang.org/elan-init.ps1
          # In-session invocation: -File passes args as strings, which cannot
          # bind to the installer's [bool] parameters.
          & ./elan-init.ps1 -NoPrompt $true -NoModifyPath $true -DefaultToolchain stable
          Remove-Item elan-init.ps1
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.elan\bin"

      # Blender validates headless (`blender -b`). Official builds come from
      # the Blender mirrors (download.blender.org sits behind a bot check that
      # rejects curl), cached per OS. Pinned to the latest LTS; the engine's
      # floor is 4.2 LTS. Linux needs the X/GL client libs even headless.
      - name: Cache Blender
        if: (env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.blender == 'true')
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender
          key: blender-5.2.2-${{ runner.os }}-${{ runner.arch }}

      - name: Install Blender (Linux)
        if: matrix.os == 'ubuntu-latest' && (env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.blender == 'true')
        shell: bash
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 libice6
          BL="$RUNNER_TEMP/blender"
          if [ ! -x "$BL/blender" ]; then
            f=blender-5.2.2-linux-x64.tar.xz
            for m in https://mirrors.ocf.berkeley.edu/blender/release https://ftp.halifax.rwth-aachen.de/blender/release; do
              curl -sSfL --retry 2 -o "$RUNNER_TEMP/$f" "$m/Blender5.2/$f" && break
            done
            mkdir -p "$BL" && tar -xf "$RUNNER_TEMP/$f" -C "$BL" --strip-components=1 && rm "$RUNNER_TEMP/$f"
          fi
          echo "$BL" >> "$GITHUB_PATH"

      - name: Install Blender (macOS)
        if: matrix.os == 'macos-latest' && (env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.blender == 'true')
        shell: bash
        run: |
          BL="$RUNNER_TEMP/blender"
          if [ ! -d "$BL/Blender.app" ]; then
            f=blender-5.2.2-macos-arm64.dmg
            for m in https://mirrors.ocf.berkeley.edu/blender/release https://ftp.halifax.rwth-aachen.de/blender/release; do
              curl -sSfL --retry 2 -o "$RUNNER_TEMP/$f" "$m/Blender5.2/$f" && break
            done
            mkdir -p "$BL"
            hdiutil attach -nobrowse -quiet -mountpoint "$RUNNER_TEMP/blender-dmg" "$RUNNER_TEMP/$f"
            cp -R "$RUNNER_TEMP/blender-dmg/Blender.app" "$BL/"
            hdiutil detach -quiet "$RUNNER_TEMP/blender-dmg" && rm "$RUNNER_TEMP/$f"
          fi
          # A wrapper, not a symlink: Blender locates its bundle from the real executable path.
          mkdir -p "$BL/bin"
          printf '#!/bin/sh\nexec "%s/Blender.app/Contents/MacOS/Blender" "$@"\n' "$BL" > "$BL/bin/blender"
          chmod +x "$BL/bin/blender"
          echo "$BL/bin" >> "$GITHUB_PATH"

      - name: Install Blender (Windows)
        if: matrix.os == 'windows-latest' && (env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.blender == 'true')
        shell: pwsh
        run: |
          $BL = Join-Path $env:RUNNER_TEMP "blender"
          if (-not (Test-Path (Join-Path $BL "blender.exe"))) {
            $f = "blender-5.2.2-windows-x64.zip"
            $zip = Join-Path $env:RUNNER_TEMP $f
            foreach ($m in @("https://mirrors.ocf.berkeley.edu/blender/release", "https://ftp.halifax.rwth-aachen.de/blender/release")) {
              curl.exe -sSfL --retry 2 -o $zip "$m/Blender5.2/$f"
              if ($LASTEXITCODE -eq 0) { break }
            }
            7z x $zip "-o$env:RUNNER_TEMP" -y | Out-Null
            Move-Item (Join-Path $env:RUNNER_TEMP "blender-5.2.2-windows-x64") $BL
            Remove-Item $zip
          }
          Add-Content $env:GITHUB_PATH $BL

      # KiCad 10 for the kicad engine: kicad-cli plus the Python that can
      # import pcbnew. Linux uses the official PPA without the multi-GB
      # symbol/footprint/3D libraries; macOS runs straight from the mounted
      # DMG; Windows runs the official installer silently.
      - name: Install KiCad (Linux)
        if: matrix.os == 'ubuntu-latest' && (env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.kicad == 'true')
        shell: bash
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends kicad || (sleep 15 && sudo apt-get install -y -q --no-install-recommends kicad)
          kicad-cli version
          /usr/bin/python3 -c "import pcbnew; print('pcbnew', pcbnew.Version())"

      - name: Install KiCad (macOS)
        if: matrix.os == 'macos-latest' && (env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.kicad == 'true')
        shell: bash
        run: |
          f=kicad-unified-universal-10.0.6.dmg
          curl -sSfL --retry 2 -o "$RUNNER_TEMP/$f" "https://github.com/KiCad/kicad-source-mirror/releases/download/10.0.6/$f"
          hdiutil attach -nobrowse -quiet -mountpoint "$RUNNER_TEMP/kicad-dmg" "$RUNNER_TEMP/$f"
          APP=$(find "$RUNNER_TEMP/kicad-dmg" -maxdepth 2 -name KiCad.app -type d | head -1)
          echo "$APP/Contents/MacOS" >> "$GITHUB_PATH"
          "$APP/Contents/MacOS/kicad-cli" version

      - name: Install KiCad (Windows)
        if: matrix.os == 'windows-latest' && (env.FULL_INSTALL == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.kicad == 'true')
        shell: pwsh
        run: |
          $f = "kicad-10.0.6-x86_64.exe"
          $exe = Join-Path $env:RUNNER_TEMP $f
          curl.exe -sSfL --retry 2 -o $exe "https://github.com/KiCad/kicad-source-mirror/releases/download/10.0.6/$f"
          if ($LASTEXITCODE -ne 0) { throw "KiCad download failed" }
          Start-Process -FilePath $exe -ArgumentList "/S" -Wait
          Remove-Item $exe
          $bin = "C:\Program Files\KiCad\10.0\bin"
          if (-not (Test-Path (Join-Path $bin "kicad-cli.exe"))) { throw "kicad-cli.exe not found in $bin" }
          # Append via GITHUB_ENV, not GITHUB_PATH (which prepends): KiCad's
          # bin dir ships its own python.exe, which would shadow the matrix
          # Python for every later step.
          Add-Content $env:GITHUB_ENV "PATH=$env:PATH;$bin"
          & (Join-Path $bin "kicad-cli.exe") version

      - name: Install dependencies
        if: env.FULL_INSTALL == 'true' || steps.scope.outputs.code == 'true'
        run: pip install -e . && pip install pytest pytest-cov

      # cg/ must remain a PEP 420 namespace package — a stray
      # cg/__init__.py here would ship in the wheel and shadow every
      # other package that contributes widgets under cg/ on users'
      # machines (including cartograph-mcp). Catch it at the source.
      - name: Guard cg/ namespace
        shell: bash
        run: |
          if [ -f cg/__init__.py ]; then
            echo "::error file=cg/__init__.py::cg/__init__.py must not exist - cg/ is a namespace package. Remove it."
            exit 1
          fi

      - name: Run tests
        if: env.FULL_INSTALL == 'true' || steps.scope.outputs.code == 'true'
        run: pytest --tb=short -q

  # Repo tests run against the checkout (editable install + repo cwd), which
  # hides wheel-layout bugs: openscad's engine was missing from every wheel
  # v0.5.17-v0.7.4 because its bundled-widget path only resolved in the repo.
  # Build the real wheel, install it clean, and verify away from the repo.
  wheel-verify:
    name: Verify engines in built wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build and install wheel
        run: |
          pip install build
          python -m build --wheel
          pip install dist/*.whl

      - name: Verify all engines register (outside repo)
        working-directory: /tmp
        run: |
          python -c "
          from cartograph.languages import supported_languages
          langs = set(supported_languages())
          expected = {'angular', 'blender', 'csharp', 'flutter', 'gdscript', 'go', 'java', 'javascript',
                      'lean', 'nim', 'openscad', 'php', 'python', 'rust',
                      'spice', 'systemverilog', 'terraform', 'typescript'}
          missing = expected - langs
          assert not missing, f'engines missing from wheel install: {missing}'
          print('all engines registered:', sorted(langs))
          "

  # After tests pass on master, auto-tag if pyproject.toml's version was
  # bumped. The tag push then fires publish.yml (PyPI -> fresh-install ->
  # GitHub release) on its own. Skipped on PRs and on workflow_call from
  # publish.yml (that workflow already triggered from a tag).
  auto-tag:
    name: Auto-tag on version bump
    needs: [test, wheel-verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version from pyproject.toml
        id: ver
        run: |
          version=$(grep -E '^version = "' pyproject.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version in pyproject.toml: $version"

      - name: Check if tag already exists
        id: tagcheck
        env:
          TAG: v${{ steps.ver.outputs.version }}
          version: ${{ steps.ver.outputs.version }}
        run: |
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            # Loud, not silent: a green run that quietly shipped nothing is the
            # exact trap that hid an unreleased SPICE flip. Surface it as a
            # warning annotation + job summary so "did this publish?" is
            # answerable at a glance. Warning, not failure, because a non-release
            # commit on master legitimately leaves the version untouched.
            echo "::warning title=No release published::pyproject.toml is at $version and tag $TAG already exists, so the auto-tag/publish chain was SKIPPED - nothing shipped from this push. If you intended to release, bump the version in pyproject.toml and push again. If this was a non-release commit, ignore."
            {
              echo "### :warning: No release published"
              echo ""
              echo "\`pyproject.toml\` is at **$version** and tag **$TAG** already exists, so the auto-tag/publish chain was **skipped - nothing shipped from this push.**"
              echo ""
              echo "- Meant to release? Bump the version in \`pyproject.toml\` and push again."
              echo "- Intentional non-release commit? You can ignore this."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist - will create."
          fi

      - name: Create and push tag
        if: steps.tagcheck.outputs.exists == 'false'
        env:
          TAG: v${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      # Tags pushed by GITHUB_TOKEN don't trigger workflows, so the push above
      # won't fire publish.yml on its own. Dispatch it explicitly at the new
      # tag ref so PyPI -> fresh-install -> release fires end to end.
      - name: Dispatch publish workflow
        if: steps.tagcheck.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.ver.outputs.version }}
        run: gh workflow run publish.yml --ref "$TAG"
