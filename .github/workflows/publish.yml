name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  # Full 9-cell matrix on the tagged commit. Blocks PyPI upload.
  tests:
    name: Tests
    uses: ./.github/workflows/test.yml
    with:
      full_install: true

  publish:
    name: Build and publish
    needs: tests
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hatch
        run: pip install hatch

      - name: Build
        run: hatch build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  # Post-publish sanity: install the just-shipped wheel from PyPI and run
  # cartograph scaffold commands against it. Blocks the GitHub release.
  fresh-install:
    name: Fresh install
    needs: publish
    uses: ./.github/workflows/fresh-install.yml

  release:
    name: Create GitHub release
    needs: fresh-install
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
