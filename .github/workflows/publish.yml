name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  # Invoked by test.yml's auto-tag job with --ref v<version>. Needed because
  # tags pushed by GITHUB_TOKEN don't fire the `push` trigger above (anti-loop
  # safety), so the auto-tag chain would otherwise stall here.
  workflow_dispatch:

jobs:
  # Full 9-cell matrix on the tagged commit. Blocks PyPI upload.
  #
  # Skipped on the auto-tag path (workflow_dispatch): test.yml already ran the
  # full matrix on this exact commit on the master push that created the tag,
  # so re-running it here is pure duplication. Kept for raw `push` of a tag
  # (a hand-cut release) where no prior gating run is guaranteed.
  tests:
    name: Tests
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/test.yml
    with:
      full_install: true

  publish:
    name: Build and publish
    needs: tests
    # Proceed when tests passed OR were skipped (auto-tag path, already gated
    # on master). Without always() a skipped `needs` would skip publish too.
    if: ${{ always() && needs.tests.result != 'failure' && needs.tests.result != 'cancelled' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install hatch
        run: pip install hatch

      - name: Build
        run: hatch build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  # Post-publish sanity: install the just-shipped wheel from PyPI and run
  # cartograph scaffold commands against it. Blocks the GitHub release.
  fresh-install:
    name: Fresh install
    needs: publish
    uses: ./.github/workflows/fresh-install.yml

  release:
    name: Create GitHub release
    needs: fresh-install
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Find the previous tag (skip the one we just cut) so we can list
          # commits since then. Falls back to the whole history if this is
          # the first tag ever.
          prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$prev" ]; then
            range="${prev}..${TAG}"
            compare="https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${TAG}"
          else
            range="${TAG}"
            compare=""
          fi

          # One bullet per non-merge commit: "- subject (hash)".
          # gh CLI doesn't need markdown escaping here; subjects are fine as-is.
          commits=$(git log "$range" --no-merges --pretty=format:"- %s (%h)")

          {
            echo "## What's Changed"
            echo ""
            echo "$commits"
            if [ -n "$compare" ]; then
              echo ""
              echo "**Full Changelog**: $compare"
            fi
          } > release-notes.md

          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file release-notes.md
