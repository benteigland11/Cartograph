name: Fresh Install Test

on:
  workflow_call:

jobs:
  fresh-install:
    name: Fresh install from PyPI
    runs-on: ubuntu-latest
    needs: []

    # Wait for PyPI to have the package available
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install from PyPI (with retry)
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Waiting for cartograph-cli==$VERSION on PyPI..."
          for i in $(seq 1 30); do
            if pip install "cartograph-cli==$VERSION" 2>&1; then
              echo "Installed cartograph-cli==$VERSION"
              exit 0
            fi
            echo "Attempt $i/30 - not yet available, waiting 10s..."
            sleep 10
          done
          echo "Failed to install cartograph-cli==$VERSION after 30 attempts"
          exit 1

      - name: cartograph --help
        run: cartograph --help

      # Engines import bundled cg/ widgets; a path or shadowing bug makes one
      # silently vanish from the registry in wheel installs while repo CI stays
      # green (openscad was missing from every wheel v0.5.17-v0.7.4 this way).
      - name: Verify all engines register in wheel install
        run: |
          python -c "
          from cartograph.languages import supported_languages
          langs = set(supported_languages())
          expected = {'angular', 'go', 'javascript', 'nim', 'openscad',
                      'php', 'python', 'systemverilog', 'terraform',
                      'typescript'}
          missing = expected - langs
          assert not missing, f'engines missing from wheel install: {missing}'
          print('all engines registered:', sorted(langs))
          "

      - name: cartograph doctor
        run: cartograph doctor || true

      - name: Install test deps
        run: pip install pytest coverage

      - name: cartograph setup
        run: cartograph setup

      - name: cartograph create
        run: cartograph create backend-ci-test-python --language python --domain backend --name "CI Test"

      - name: Verify widget structure
        run: |
          # Find the created widget dir dynamically instead of hardcoding
          WIDGET_DIR=$(find cg -maxdepth 2 -name "widget.json" -printf "%h" -quit)
          echo "Widget created at: $WIDGET_DIR"
          test -f "$WIDGET_DIR/widget.json"
          test -d "$WIDGET_DIR/src"
          test -d "$WIDGET_DIR/tests"

      - name: Install Angular CLI
        run: npm install -g @angular/cli

      - name: cartograph create (angular)
        run: cartograph create frontend-ci-test-angular --language angular --domain frontend --name "CI Angular Test"

      - name: Verify angular widget structure
        run: |
          WIDGET_DIR=$(find cg -maxdepth 2 -name "angular.json" -printf "%h" -quit)
          echo "Angular widget at: $WIDGET_DIR"
          test -f "$WIDGET_DIR/angular.json"
          test -f "$WIDGET_DIR/package.json"
          test -f "$WIDGET_DIR/karma.conf.js"
          test -f "$WIDGET_DIR/ng-package.json"
          test -d "$WIDGET_DIR/src"
          test -d "$WIDGET_DIR/tests"

      - name: Install PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pcov
          tools: composer

      - name: cartograph create (php)
        run: cartograph create backend-ci-test-php --language php --domain backend --name "CI PHP Test"

      - name: Verify php widget structure
        run: |
          WIDGET_DIR=$(find cg -maxdepth 2 -name "composer.json" -printf "%h" -quit)
          echo "PHP widget at: $WIDGET_DIR"
          test -f "$WIDGET_DIR/composer.json"
          test -f "$WIDGET_DIR/phpunit.xml"
          test -d "$WIDGET_DIR/src"
          test -d "$WIDGET_DIR/tests"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.9.0'
          terraform_wrapper: false

      - name: cartograph create (terraform)
        run: cartograph create devops-ci-test-terraform --language terraform --domain devops --name "CI Terraform Test"

      - name: Verify terraform widget structure
        run: |
          WIDGET_DIR=$(find cg -maxdepth 3 -name "versions.tf" -printf "%h" -quit)
          # versions.tf lives in src/, so step up to the widget root
          WIDGET_DIR=$(dirname "$WIDGET_DIR")
          echo "Terraform widget at: $WIDGET_DIR"
          test -f "$WIDGET_DIR/src/versions.tf"
          test -f "$WIDGET_DIR/src/variables.tf"
          test -f "$WIDGET_DIR/src/outputs.tf"
          test -d "$WIDGET_DIR/tests"
          test -d "$WIDGET_DIR/examples"

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: cartograph create (go)
        run: cartograph create universal-ci-test-go --language go --domain universal --name "CI Go Test"

      - name: Verify go widget structure
        run: |
          WIDGET_DIR=$(find cg -maxdepth 2 -name "go.mod" -printf "%h" -quit)
          echo "Go widget at: $WIDGET_DIR"
          test -f "$WIDGET_DIR/go.mod"
          test -d "$WIDGET_DIR/src"
          test -d "$WIDGET_DIR/tests"
          test -d "$WIDGET_DIR/examples"

      - name: cartograph stats
        run: cartograph stats
