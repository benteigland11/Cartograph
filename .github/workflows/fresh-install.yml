name: Fresh Install Test

on:
  workflow_call:

jobs:
  fresh-install:
    name: Fresh install from PyPI
    runs-on: ubuntu-latest
    needs: []

    # Wait for PyPI to have the package available
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install from PyPI (with retry)
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Waiting for cartograph-cli==$VERSION on PyPI..."
          for i in $(seq 1 30); do
            if pip install "cartograph-cli==$VERSION" 2>&1; then
              echo "Installed cartograph-cli==$VERSION"
              exit 0
            fi
            echo "Attempt $i/30 - not yet available, waiting 10s..."
            sleep 10
          done
          echo "Failed to install cartograph-cli==$VERSION after 30 attempts"
          exit 1

      - name: cartograph --help
        run: cartograph --help

      # Engines import bundled cg/ widgets; a path or shadowing bug makes one
      # silently vanish from the registry in wheel installs while repo CI stays
      # green (openscad was missing from every wheel v0.5.17-v0.7.4 this way).
      - name: Verify all engines register in wheel install
        run: |
          python -c "
          from cartograph.languages import supported_languages
          langs = set(supported_languages())
          expected = {'angular', 'csharp', 'flutter', 'gdscript', 'go', 'java', 'javascript',
                      'lean', 'nim', 'openscad', 'php', 'python', 'rust',
                      'spice', 'systemverilog', 'terraform', 'typescript'}
          missing = expected - langs
          assert not missing, f'engines missing from wheel install: {missing}'
          print('all engines registered:', sorted(langs))
          "

      - name: cartograph doctor
        run: cartograph doctor || true

      - name: Install test deps
        run: pip install pytest coverage

      - name: cartograph setup
        run: cartograph setup

      - name: cartograph create
        run: cartograph create backend-ci-test-python --language python --domain backend --name "CI Test"

      - name: Verify widget structure
        run: |
          # Find the created widget dir dynamically instead of hardcoding
          WIDGET_DIR=$(find cg -maxdepth 2 -name "widget.json" -printf "%h" -quit)
          echo "Widget created at: $WIDGET_DIR"
          test -f "$WIDGET_DIR/widget.json"
          test -d "$WIDGET_DIR/src"
          test -d "$WIDGET_DIR/tests"

      - name: Install Angular CLI
        run: npm install -g @angular/cli

      - name: cartograph create (angular)
        run: cartograph create frontend-ci-test-angular --language angular --domain frontend --name "CI Angular Test"

      - name: Verify angular widget structure
        run: |
          WIDGET_DIR=$(find cg -maxdepth 2 -name "angular.json" -printf "%h" -quit)
          echo "Angular widget at: $WIDGET_DIR"
          test -f "$WIDGET_DIR/angular.json"
          test -f "$WIDGET_DIR/package.json"
          test -f "$WIDGET_DIR/karma.conf.js"
          test -f "$WIDGET_DIR/ng-package.json"
          test -d "$WIDGET_DIR/src"
          test -d "$WIDGET_DIR/tests"

      - name: Install PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pcov
          tools: composer

      - name: cartograph create (php)
        run: cartograph create backend-ci-test-php --language php --domain backend --name "CI PHP Test"

      - name: Verify php widget structure
        run: |
          WIDGET_DIR=$(find cg -maxdepth 2 -name "composer.json" -printf "%h" -quit)
          echo "PHP widget at: $WIDGET_DIR"
          test -f "$WIDGET_DIR/composer.json"
          test -f "$WIDGET_DIR/phpunit.xml"
          test -d "$WIDGET_DIR/src"
          test -d "$WIDGET_DIR/tests"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.9.0'
          terraform_wrapper: false

      - name: cartograph create (terraform)
        run: cartograph create devops-ci-test-terraform --language terraform --domain devops --name "CI Terraform Test"

      - name: Verify terraform widget structure
        run: |
          WIDGET_DIR=$(find cg -maxdepth 3 -name "versions.tf" -printf "%h" -quit)
          # versions.tf lives in src/, so step up to the widget root
          WIDGET_DIR=$(dirname "$WIDGET_DIR")
          echo "Terraform widget at: $WIDGET_DIR"
          test -f "$WIDGET_DIR/src/versions.tf"
          test -f "$WIDGET_DIR/src/variables.tf"
          test -f "$WIDGET_DIR/src/outputs.tf"
          test -d "$WIDGET_DIR/tests"
          test -d "$WIDGET_DIR/examples"

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: cartograph create (go)
        run: cartograph create universal-ci-test-go --language go --domain universal --name "CI Go Test"

      - name: Verify go widget structure
        run: |
          WIDGET_DIR=$(find cg -maxdepth 2 -name "go.mod" -printf "%h" -quit)
          echo "Go widget at: $WIDGET_DIR"
          test -f "$WIDGET_DIR/go.mod"
          test -d "$WIDGET_DIR/src"
          test -d "$WIDGET_DIR/tests"
          test -d "$WIDGET_DIR/examples"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Add llvm-tools-preview component
        run: rustup component add llvm-tools-preview

      - name: cartograph create (rust)
        run: cartograph create universal-ci-test-rust --language rust --domain universal --name "CI Rust Test"

      - name: Verify rust widget structure
        run: |
          WIDGET_DIR=$(find cg -maxdepth 2 -name "Cargo.toml" -printf "%h" -quit)
          echo "Rust widget at: $WIDGET_DIR"
          test -f "$WIDGET_DIR/Cargo.toml"
          test -d "$WIDGET_DIR/src"
          test -d "$WIDGET_DIR/tests"
          test -d "$WIDGET_DIR/examples"

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.0
          use-dotnet: false

      - name: cartograph create (gdscript)
        run: cartograph create gamedev-ci-test-gdscript --language gdscript --domain gamedev --name "CI GDScript Test"

      - name: Verify gdscript widget structure
        run: |
          WIDGET_DIR=$(find cg -maxdepth 2 -name "project.godot" -printf "%h" -quit)
          echo "GDScript widget at: $WIDGET_DIR"
          test -f "$WIDGET_DIR/project.godot"
          test -d "$WIDGET_DIR/src"
          test -d "$WIDGET_DIR/tests"
          test -d "$WIDGET_DIR/examples"

      - name: Install JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: cartograph create (java)
        run: cartograph create universal-ci-test-java --language java --domain universal --name "CI Java Test"

      - name: Verify java widget structure
        run: |
          WIDGET_DIR=$(find cg -maxdepth 2 -name "build.gradle" -printf "%h" -quit)
          echo "Java widget at: $WIDGET_DIR"
          test -f "$WIDGET_DIR/build.gradle"
          test -f "$WIDGET_DIR/settings.gradle"
          test -f "$WIDGET_DIR/cartograph-deps.gradle"
          test -d "$WIDGET_DIR/src"
          test -d "$WIDGET_DIR/tests"
          test -d "$WIDGET_DIR/examples"

      - name: Install Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain stable || (sleep 15 && sh elan-init.sh -y --default-toolchain stable)
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: cartograph create (lean)
        run: cartograph create formal-ci-test-lean --language lean --domain formal --name "CI Lean Test"

      - name: Verify lean widget structure
        run: |
          WIDGET_DIR=$(find cg -maxdepth 2 -name "lakefile.toml" -printf "%h" -quit)
          echo "Lean widget at: $WIDGET_DIR"
          test -f "$WIDGET_DIR/lakefile.toml"
          test -d "$WIDGET_DIR/src"
          test -d "$WIDGET_DIR/tests"
          test -d "$WIDGET_DIR/examples"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: cartograph create (csharp)
        run: cartograph create universal-ci-test-csharp --language csharp --domain universal --name "CI CSharp Test"

      - name: Verify csharp widget structure
        run: |
          WIDGET_DIR=$(find cg -maxdepth 2 -name "cartograph-deps.props" -printf "%h" -quit)
          echo "CSharp widget at: $WIDGET_DIR"
          test -f "$WIDGET_DIR/cartograph-deps.props"
          test -n "$(find "$WIDGET_DIR/src" -name '*.csproj')"
          test -f "$WIDGET_DIR/tests/Tests.csproj"
          test -f "$WIDGET_DIR/examples/Examples.csproj"
          test -d "$WIDGET_DIR/src"
          test -d "$WIDGET_DIR/tests"
          test -d "$WIDGET_DIR/examples"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: cartograph create (flutter)
        run: cartograph create frontend-ci-test-flutter --language flutter --domain frontend --name "CI Flutter Test"

      - name: Verify flutter widget structure
        run: |
          WIDGET_DIR=$(find cg -maxdepth 2 -name "pubspec.yaml" -printf "%h" -quit)
          echo "Flutter widget at: $WIDGET_DIR"
          test -f "$WIDGET_DIR/pubspec.yaml"
          test -f "$WIDGET_DIR/analysis_options.yaml"
          test -d "$WIDGET_DIR/src"
          test -d "$WIDGET_DIR/tests"
          test -d "$WIDGET_DIR/examples"

      - name: cartograph stats
        run: cartograph stats
